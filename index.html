<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastermind</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>MASTERMIND</h1>
            <div class="header-controls">
                <button id="rules-btn" class="small-btn">RULES</button>
                <div id="timer" class="timer">10:00</div>
            </div>
        </header>

        <p class="instructions">Select a color, then click a circle in the highlighted row.</p>

        <main class="game-board" id="game-board">
            <!-- Rows will be generated by JS -->
        </main>

        <section class="controls">
            <div class="color-picker" id="color-picker">
                <!-- Colors will be generated by JS -->
            </div>
            <div class="actions">
                <button id="submit-guess" disabled>GUESS</button>
                <button id="new-game" class="secondary">NEW GAME</button>
            </div>
        </section>
    </div>

    <!-- Game Over Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <h2 id="modal-title">GAME OVER</h2>
            <p id="modal-message">You ran out of time!</p>
            <div id="secret-reveal" class="secret-reveal"></div>
            <button id="modal-restart">PLAY AGAIN</button>
        </div>
    </div>

    <!-- Rules Modal -->
    <div id="rules-overlay" class="modal-overlay hidden">
        <div class="modal rules-content">
            <h2>HOW TO PLAY</h2>
            <ul class="rules-list">
                <li><strong>Goal:</strong> Guess the 4 distinct colors in the correct order.</li>
                <li><strong>Limit:</strong> You have 10 turns and 10 minutes.</li>
                <li><strong>Feedback:</strong>
                    <div class="legend">
                        <div class="legend-item"><span class="dot"
                                style="background:var(--feedback-exact); opacity:1;"></span> Correct Color & Position
                        </div>
                        <div class="legend-item"><span class="dot"
                                style="background:var(--feedback-partial); opacity:1;"></span> Correct Color Only</div>
                    </div>
                </li>
            </ul>
            <button id="close-rules">GOT IT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
