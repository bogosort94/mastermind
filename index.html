<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastermind</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>MASTERMIND</h1>
            <div id="timer" class="timer">10:00</div>
        </header>

        <p class="instructions">Select a color, then click a circle in the highlighted row.</p>

        <main class="game-board" id="game-board">
            <!-- Rows will be generated by JS -->
        </main>

        <section class="controls">
            <div class="color-picker" id="color-picker">
                <!-- Colors will be generated by JS -->
            </div>
            <div class="actions">
                <button id="submit-guess" disabled>GUESS</button>
                <button id="new-game" class="secondary">NEW GAME</button>
            </div>
        </section>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <h2 id="modal-title">GAME OVER</h2>
            <p id="modal-message">You ran out of time!</p>
            <div id="secret-reveal" class="secret-reveal"></div>
            <button id="modal-restart">PLAY AGAIN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
